# Locked before formal 100-student generation. Never place API keys in this file.
schema_version: 1
locked_date: "2026-11-01"
status: locked_ready_for_preflight
supersedes: configs/pilot_frcsub_gpt4omini_v1.yaml
change_reason: user_selected_minimax_before_any_formal_preflight_or_student_generation
dataset:
  path: data/processed/frcsub
output_dir: runs/frcsub_minimax_m3_pilot_v1
seed: 42
n_students: 100
n_items: 20
state: stateless
temperature: 1.0
noise_repeats: 200
dina_n_starts: 30
dina_max_iter: 300
baselines: [independent, copula, irt, dina]
planned_student_calls: 8000
global_max_calls: 8800  # Includes two preflight requests and all failed requests.

simulator:
  type: openai_compatible
  model: MiniMax-M3
  base_url: https://api.minimax.cn/v1
  api_key_env: MINIMAX_API_KEY
  timeout: 120
  temperature_supported: false
  fixed_temperature: 1.0
  extra_body:
    thinking:
      type: disabled
    max_completion_tokens: 4096

preflight_checks:
  - id: answer_first
    temperature: 1.0
    prompt_strategy: answer_first
  - id: error_examples
    temperature: 1.0
    prompt_strategy: error_examples

cells:
  - id: none_answer_first
    persona: none
    prompt_strategy: answer_first
    max_calls: 2200
  - id: none_error_examples
    persona: none
    prompt_strategy: error_examples
    max_calls: 2200
  - id: attribute_answer_first
    persona: attribute
    prompt_strategy: answer_first
    max_calls: 2200
  - id: attribute_error_examples
    persona: attribute
    prompt_strategy: error_examples
    max_calls: 2200

model_selection:
  reason: user_selected_minimax_with_truthfully_recorded_fixed_temperature
  model_documentation: https://platform.minimax.cn/docs/api-reference/text-chat-openai
  decoding_note: M3_fixes_temperature_at_1_and_other_values_are_not_sent_or_claimed
  scope_note: closed_model_method_pilot_open_models_remain_required_for_full_experiment
